[package]
name = "circle-to-search-pc"
version = "0.1.0"
edition = "2021"
description = "Circle to Search for Desktop"
license = "MIT"
repository = "https://github.com/nkasozi/circle-to-search-pc"
homepage = "https://github.com/nkasozi/circle-to-search-pc"
build = "build.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control", "wl-clipboard-rs"] }
iced = { git = "https://github.com/iced-rs/iced.git", rev = "15c0e397a81933ca88a9a338caaac2a4689354f9", features = [
    "advanced",
    "canvas",
    "svg",
    "image",
    "lazy",
    "tokio",
] }
mouse_position = "0.1"
global-hotkey = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", default-features = false, features = ["time", "fs", "macros", "rt", "process"] }
tray-icon = "0.21"
xcap = { version = "0.7", default-features = false }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1.89"
futures = "0.3"
image = "0.25.9"
tesseract-static = { version = "0.2.0", features = ["parse"] }
reqwest = { version = "0.13.1", features = ["multipart", "blocking", "json"] }
urlencoding = "2.1"
open = "5.3"
base64 = "0.22"
cpal = "0.17"
dirs = "5.0"
sysinfo = "0.33"
auto-launch = "0.5"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
trash = "5"
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
device_query = "4"
nokhwa = { version = "0.10", features = ["input-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-avf-audio"] }
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
libc = "0.2"
objc2-avf-audio = "0.3"

[package.metadata.bundle]
name = "Circle to Search"
identifier = "com.circle-to-search.app"
version = "0.1.0"
category = "Utility"
short_description = "Circle to Search for Desktop"
long_description = "A desktop application that brings Google's Circle to Search feature to your Mac"
copyright = "Copyright (c) 2026"
icon = ["assets/icon.icns", "assets/icon.png"]
resources = ["tessdata"]

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
opt-level = 3
strip = false
lto = false
debug = true

[profile.release-optimized]
inherits = "release"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
usvg = "0.45"
